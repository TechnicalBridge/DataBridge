# =============================================================================
#  Perfil dev: para programar con Maven. spring-boot:run lo activa solo:
#      .\mvnw.cmd -f ms-auth\pom.xml spring-boot:run
# =============================================================================

#  Es el unico perfil que lee el .env (#327): Docker recibe las variables del compose,
#  y las pruebas no tienen por que ver claves de verdad. Busca un .env al lado del
#  modulo o en la raiz de TB_web. Las variables de entorno de verdad mandan sobre el.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

logging.level.com.tbridge=DEBUG
#  Las consultas que hace Hibernate, formateadas.
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

#  El detalle de la salud (la base, el disco) a la vista.
management.endpoint.health.show-details=always
