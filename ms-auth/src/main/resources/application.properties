# =============================================================================
#  ms-auth
# =============================================================================
#  Todo sale de variables de entorno. Lo que no es secreto tiene un valor por
#  omision de desarrollo. Los secretos no: si falta uno, el servicio no
#  arranca y dice cual. Un valor escrito aqui seria publico, y quien olvidara
#  cambiarlo quedaria con un secreto que cualquiera puede leer. El .env con
#  claves al azar lo crea preparar-env.ps1, en la raiz de TB_web.
#
#  Perfiles:  dev  (registro detallado y SQL visible)   test  (pruebas)
# =============================================================================

spring.application.name=ms-auth
server.port=${PORT:8081}

#  Un .env al lado del modulo o en la raiz de TB_web, si lo hay. Las variables
#  de entorno de verdad (Docker, la terminal) igual mandan sobre el.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

#  Detras del gateway: la IP del cliente y la direccion publica salen de las
#  cabeceras X-Forwarded-*. Sin esto, los enlaces de HATEOAS apuntarian al
#  contenedor (ms-auth:8081) y el freno por origen veria solo al gateway.
server.forward-headers-strategy=framework

spring.jmx.enabled=false

# ---- Base de datos: MySQL, con el esquema en manos de Flyway -----------------
#  Su propia base (#238). En Docker, el compose le da DB_PORT y DB_PASSWORD;
#  con Maven, salen de DB_AUTH_PORT y DB_AUTH_PASSWORD del mismo .env.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:${DB_AUTH_PORT:3308}}/${DB_NAME:tb_auth}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Santiago&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:${MYSQL_USER:tbridge}}
spring.datasource.password=${DB_PASSWORD:${DB_AUTH_PASSWORD}}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#  validate: si las entidades y las tablas dejan de calzar, el servicio no
#  arranca, en vez de alterar la base en silencio.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

# ---- JSON ---------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- Correo -------------------------------------------------------------------
#  Sin SMTP_HOST no se manda nada: el codigo y el enlace quedan en el log, que
#  es lo que permite trabajar sin un servidor de correo.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
#  true para un servidor que pide SSL desde el principio (puerto 465), en vez de STARTTLS.
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
#  Cuanto se espera al servidor: sin esto, uno que no responde deja colgado el
#  envio, y con el la pasada de la campana.
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_TIMEOUT_MS:10000}
#  En Docker, el buzon de prueba que hay a mano (Mailpit). Sin SMTP_HOST el
#  correo va ahi, y el resto de SMTP_* se ignora (ver BuzonDePrueba).
app.mail.buzon-de-prueba=${CORREO_BUZON_DE_PRUEBA:}
#  Con una clave de Brevo, los correos salen por su API (HTTPS) en vez de SMTP:
#  es lo que funciona en Railway, que bloquea el SMTP salvo en su plan Pro. El
#  remitente (MAIL_FROM) tiene que estar verificado en la cuenta de Brevo. La
#  clave va solo en el .env o en las variables de Railway.
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.url=${BREVO_URL:https://api.brevo.com/v3/smtp/email}
#  Cuanto se espera a Brevo: el mismo tiempo que a un servidor SMTP.
app.mail.timeout-ms=${SMTP_TIMEOUT_MS:10000}
#  El modo de prueba: a quien se le escribe de verdad con un servidor real.
#  Sin las dos, se le escribe a cualquier direccion (ver ModoDePrueba).
app.mail.solo-a=${CORREO_SOLO_A:}
app.mail.desviar-a=${CORREO_DESVIAR_A:}
#  Cuantos correos desvia el modo de prueba en un dia de Chile: el desvio sale
#  por el proveedor y gasta su cupo, que en Brevo es diario (#236). Pasado el
#  tope, lo desviado no sale y queda en el log. 0, sin tope. Lo de un dominio
#  reservado (example.com, .test...) nunca sale por el proveedor directo: va al
#  buzon de prueba si lo hay, o al desvio.
app.mail.desvio-maximo-por-dia=${CORREO_DESVIO_MAXIMO_POR_DIA:100}

# ---- La sesion ----------------------------------------------------------------
#  Pareja PKCS#8/SPKI montada solo en auth.
jwt.key-directory=${JWT_KEY_DIRECTORY}
#  Poco a proposito: el JWT no se puede revocar, se valida solo con la firma.
#  Lo que mantiene a alguien adentro mas tiempo es la llave de renovacion.
jwt.ttl-minutes=${JWT_TTL_MINUTES:15}
#  Cuanto dura una sesion desde que se entra, se use o no. Renovar no la alarga.
app.refresh-ttl-hours=${REFRESH_TTL_HOURS:168}
#  Encender con HTTPS. Con HTTP el navegador descarta una cookie Secure sin
#  avisar, y la sesion se caeria a los quince minutos.
app.cookie-secure=${COOKIE_SECURE:false}

# ---- El acceso ----------------------------------------------------------------
app.public-url=${PUBLIC_URL:http://localhost:5173}
#  El codigo dura mas que un enlace: llega por WhatsApp y correo, y el deudor
#  puede leerlo horas despues. El enlace es el camino de excepcion.
app.code-ttl-hours=${CODE_TTL_HOURS:24}
app.magic-ttl-minutes=${MAGIC_TTL_MINUTES:15}
#  La invitacion de una persona que un admin acaba de dar de alta dura mas que
#  el enlace que alguien pide por su cuenta: no la estaba esperando.
app.invitation-ttl-hours=${INVITACION_TTL_HORAS:24}
app.internal-key=${INTERNAL_KEY}
#  El primer admin de DataBridge: entra al panel de administracion con un enlace
#  a este correo. Sin el no hay admin, y nadie entra al panel.
app.admin-email=${ADMIN_CORREO:}
#  Solo instala el personal de ejemplo cuando se pide la demo expresamente.
app.demo.datos=${DEMO_DATOS:false}
#  Para preguntarle a ms-debt el correo registrado de un deudor (#59).
app.debt-url=${DEBT_URI:http://127.0.0.1:8083}
app.from-email=${MAIL_FROM:noreply@technicalbridge.local}
#  El nombre que muestra el buzon al lado del remitente, y a quien se le
#  responde, si no es al remitente.
app.mail.from-name=${MAIL_FROM_NAME:DataBridge}
app.mail.reply-to=${MAIL_REPLY_TO:}

# ---- Salud y documentacion ----------------------------------------------------
#  Solo la salud, que es lo que pregunta el healthcheck de Docker. Ningun
#  otro endpoint del actuator se publica, ni siquiera dentro de la red.
management.endpoints.web.exposure.include=health
#  El correo no entra en la salud: si el SMTP se cae, el servicio sigue
#  funcionando (los mensajes quedan en el log) y no tiene por que marcarse caido.
management.health.mail.enabled=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
app.openapi.url-interna=${OPENAPI_URL_INTERNA:http://localhost:8081}

logging.level.com.tbridge=INFO
