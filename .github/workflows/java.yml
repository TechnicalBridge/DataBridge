# =============================================================================
#  Las pruebas de un servicio Java — workflow reutilizable
# =============================================================================
#  Lo llaman gateway.yml, ms-auth.yml, ms-debt.yml, ms-payments.yml y ms-ai.yml: cada
#  servicio se compila y se prueba solo, con su propio pom, y deja en el
#  resumen de la corrida cuantas pruebas pasaron, clase por clase.
#
#  Las pruebas unitarias y de controlador no necesitan base de datos.
#  La prueba de concurrencia de claves API usa un MySQL efímero en ms-debt.
# =============================================================================
name: Java

on:
  workflow_call:
    inputs:
      modulo:
        description: La carpeta del servicio
        required: true
        type: string

permissions:
  contents: read

jobs:
  probar:
    #  En la lista de checks del PR se lee el modulo: "Pruebas de ms-debt".
    name: Pruebas de ${{ inputs.modulo }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODULO: ${{ inputs.modulo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          #  El token de GitHub no se queda guardado en el repositorio clonado.
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ inputs.modulo }}/pom.xml

      #  ms-debt y ms-payments guardan cada uno una copia del contrato del aviso
      #  de pago, y cada uno se prueba contra la suya: las dos tienen que ser iguales.
      - name: El contrato del aviso de pago, igual en los dos servicios
        if: inputs.modulo == 'ms-debt' || inputs.modulo == 'ms-payments'
        run: cmp ms-debt/src/test/resources/contratos/pago-confirmado.json ms-payments/src/test/resources/contratos/pago-confirmado.json

      - name: MySQL aislado para la prueba concurrente de claves API
        if: inputs.modulo == 'ms-debt' && hashFiles('ms-debt/src/test/java/com/tbridge/debt/service/ApiKeyMySqlConcurrencyTest.java') != ''
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          container=$(docker run --rm --detach --publish 127.0.0.1::3306 \
            --env MYSQL_RANDOM_ROOT_PASSWORD=yes --env MYSQL_DATABASE=tb_debt_api_test \
            --env MYSQL_USER=qa --env MYSQL_PASSWORD="$password" mysql:8.4 --skip-log-bin)
          echo "API_TEST_CONTAINER=$container" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if docker exec --env MYSQL_PWD="$password" "$container" \
              mysql --protocol=TCP --host=127.0.0.1 --user=qa tb_debt_api_test --execute='SELECT 1' >/dev/null 2>&1; then
              endpoint=$(docker port "$container" 3306/tcp)
              echo "DB_API_TEST_URL=jdbc:mysql://$endpoint/tb_debt_api_test?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC" >> "$GITHUB_ENV"
              echo "DB_TEST_USER=qa" >> "$GITHUB_ENV"
              echo "DB_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no quedó listo para la prueba de claves API" >&2
          exit 1

      #  mvn y no ./mvnw: el wrapper esta en git sin el bit de ejecucion (se
      #  commitea desde Windows), y en Linux daria "Permission denied". El
      #  runner de GitHub ya trae Maven.
      - name: Pruebas
        run: mvn -B -f "$MODULO/pom.xml" test

      - name: Retirar MySQL de la prueba concurrente
        if: always() && env.API_TEST_CONTAINER != ''
        run: docker stop "$API_TEST_CONTAINER"

      - name: Resumen de las pruebas
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          modulo = os.environ["MODULO"]
          filas, total = [], [0, 0, 0, 0]
          for ruta in sorted(glob.glob(f"{modulo}/target/surefire-reports/TEST-*.xml")):
              suite = ET.parse(ruta).getroot()
              n = [int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")]
              total = [a + b for a, b in zip(total, n)]
              filas.append((suite.get("name").rsplit(".", 1)[-1], n[0], n[1] + n[2]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as resumen:
              resumen.write(f"## {modulo}: {total[0]} pruebas, {total[1] + total[2]} con fallas\n\n")
              resumen.write("| Clase | Pruebas | Fallas |\n| --- | --- | --- |\n")
              for clase, pruebas, fallas in filas:
                  resumen.write(f"| {clase} | {pruebas} | {fallas} |\n")
          EOF
