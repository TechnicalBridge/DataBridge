name: Desplegar

#  Compila las seis imagenes de DataBridge, las publica en GHCR y actualiza el
#  servidor (#172, guia en docs/despliegue).
#
#  APAGADO HASTA QUE EXISTA EL SERVIDOR: sin la variable DESPLIEGUE_HOST del
#  repositorio (Settings -> Secrets and variables -> Actions -> Variables), un
#  push a main no hace nada. Un PR que toca el despliegue, o a mano (Run
#  workflow) con "Solo compilar", prueba que las imagenes se construyen, sin
#  publicarlas ni tocar ningun servidor.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "rendimiento/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths: [".github/workflows/desplegar.yml", "docker-compose.prod.yml", "deploy/**"]
  workflow_dispatch:
    inputs:
      solo_compilar:
        description: "Solo compilar las imagenes, sin publicarlas ni desplegar"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  imagenes:
    name: Imagen de ${{ matrix.servicio }}
    if: vars.DESPLIEGUE_HOST != '' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.solo_compilar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { servicio: gateway, carpeta: gateway }
          - { servicio: ms-auth, carpeta: ms-auth }
          - { servicio: ms-debt, carpeta: ms-debt }
          - { servicio: ms-payments, carpeta: ms-payments }
          - { servicio: ms-ai, carpeta: ms-ai }
          - { servicio: portal, carpeta: frontend }
    env:
      #  Solo se publica lo de main, y nunca con "Solo compilar".
      PUBLICAR: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.solo_compilar) }}
      IMAGEN: ghcr.io/technicalbridge/databridge-${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Entrar a GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar, y publicar si es main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.carpeta }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  desplegar:
    name: Actualizar el servidor
    needs: imagenes
    if: vars.DESPLIEGUE_HOST != '' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.solo_compilar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: produccion
      url: https://${{ vars.DESPLIEGUE_DOMINIO }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: La llave y la huella del servidor
        env:
          LLAVE: ${{ secrets.DESPLIEGUE_LLAVE }}
          HUELLA: ${{ secrets.DESPLIEGUE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HUELLA" > ~/.ssh/known_hosts

      #  El servidor baja el compose de este commit y sus imagenes, y se
      #  actualiza. El token de GHCR viaja por la entrada estandar, no en la
      #  linea de comandos, y solo vale mientras corre este job.
      - name: Descargar las imagenes y actualizar
        env:
          HOST: ${{ vars.DESPLIEGUE_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ github.sha }}
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/despliegue -o BatchMode=yes "databridge@$HOST" "
            set -e
            cd /opt/databridge
            git fetch -q origin main
            git reset -q --hard $VERSION
            docker login ghcr.io -u $ACTOR --password-stdin >/dev/null
            export VERSION=$VERSION
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app pull -q
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --no-build --wait --wait-timeout 600
            docker logout ghcr.io >/dev/null
            docker image prune -f >/dev/null
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app ps --format '{{.Service}}: {{.Status}}'
          "
