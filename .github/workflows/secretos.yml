name: Secretos

#  Que ninguna clave llegue al repositorio (#232): gitleaks revisa los commits
#  nuevos de cada PR y de cada push a main, con las reglas de .gitleaks.toml,
#  y nunca muestra el valor que encuentra. El historial no se revisa entero:
#  trae las claves de #245, que ya se revocaron. GitHub, por su lado, bloquea
#  el push de los proveedores que conoce. Ver docs/seguridad/secretos.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

#  En un PR, la corrida nueva reemplaza a la anterior: revisa base..head entero.
#  En main no se cancela nada: cada push revisa solo desde el anterior, y una
#  corrida cancelada dejaria esos commits sin revisar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secretos:
    name: Secretos en los commits nuevos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      #  La version fijada, y su suma comparada con la que publica gitleaks.
      - name: Gitleaks 8.30.1, con su suma comprobada
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"

      - name: Las reglas detectan lo que tienen que detectar
        run: node --test pruebas/secretos.test.cjs

      - name: Los commits nuevos, sin mostrar valores
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [[ "$BASE" =~ ^[a-f0-9]{40}$ ]] || { echo "Sin un commit base valido"; exit 1; }
          git cat-file -e "$BASE^{commit}"
          node scripts/verificar-secretos.cjs --base "$BASE"
