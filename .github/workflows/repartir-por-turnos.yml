name: Repartir por turnos

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Numero del issue (también recupera otros pendientes)
        required: true
        type: number
  schedule:
    - cron: '17,47 * * * *'

# Cada ejecución reconcilia todos los pendientes. Si GitHub sustituye una
# ejecución en espera, la siguiente o la programada recupera sus issues.
concurrency:
  group: reparto-por-turnos
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  repartir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test pruebas/repartir-por-turnos.test.cjs
      - run: node .github/scripts/repartir-por-turnos.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
