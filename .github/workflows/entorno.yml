name: Entorno Windows

on:
  push:
    branches: [main]
    paths: ['preparar-env.ps1', '.env.example', 'scripts/restaurar-instalacion.cjs', 'pruebas/**', '.github/workflows/entorno.yml']
  pull_request:
    paths: ['preparar-env.ps1', '.env.example', 'scripts/restaurar-instalacion.cjs', 'pruebas/**', '.github/workflows/entorno.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: Preparacion de entorno en PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Pruebas sin Docker ni credenciales reales
        shell: powershell
        run: |
          node --test pruebas\entorno.test.cjs pruebas\restauracion.test.cjs
          exit $LASTEXITCODE
