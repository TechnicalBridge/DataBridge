# =============================================================================
#  Perfil integracion: ms-debt levantado de verdad, con un MySQL de verdad en un
#  contenedor. Lo usan las pruebas de integracion, seguridad y rendimiento.
#  La URL y la clave de la base las pone el contenedor: ver ServicioConMysql.
#  Todos son valores de prueba, y sin RabbitMQ: estas pruebas no lo necesitan.
# =============================================================================

spring.flyway.enabled=true

events.rabbit=false
spring.rabbitmq.listener.simple.auto-startup=false
management.health.rabbit.enabled=false
spring.rabbitmq.password=sin-uso

AUTH_JWKS_URI=http://ms-auth.invalid/.well-known/jwks.json
app.internal-key=clave-interna-de-prueba
app.auth-url=http://ms-auth.invalid
app.cifrado.llave=llave-de-prueba
logging.level.com.tbridge=WARN
