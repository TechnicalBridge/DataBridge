# =============================================================================
#  Perfil test: lo usan las pruebas de controlador (@ActiveProfiles("test")).
#  Sin base, sin Flyway y sin RabbitMQ: los servicios van simulados con Mockito.
# =============================================================================

spring.flyway.enabled=false
events.rabbit=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.password=prueba
management.health.rabbit.enabled=false

#  El contexto completo arma el decodificador remoto aunque las pruebas usen
#  uno local: la direccion solo tiene que ser valida, nunca se consulta.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:1/.well-known/jwks.json

app.internal-key=clave-interna-de-prueba
app.auth-url=http://127.0.0.1:1
app.cifrado.llave=llave-de-prueba

logging.level.com.tbridge=WARN
