# =============================================================================
#  Perfil dev: para programar con Maven. spring-boot:run lo activa solo:
#      .\mvnw.cmd -f ms-payments\pom.xml spring-boot:run
# =============================================================================

#  Es el unico perfil que lee el .env (#327): Docker recibe las variables del compose,
#  y las pruebas no tienen por que ver claves de verdad. Busca un .env al lado del
#  modulo o en la raiz de TB_web. Las variables de entorno de verdad mandan sobre el.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

logging.level.com.tbridge=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
management.endpoint.health.show-details=always

#  Los avisos a ms-debt salen cada dos segundos en vez de quince: al probar un
#  pago a mano, el saldo se actualiza casi al instante.
app.dispatch-interval-ms=2000
