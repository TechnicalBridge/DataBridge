# =============================================================================
#  ms-ai
# =============================================================================
#  Todo sale de variables de entorno, con valores por omision de desarrollo.
#  No tiene secretos obligatorios: sin llave del LLM responde con reglas.
#
#  Perfiles:  dev  (registro detallado)
# =============================================================================

spring.application.name=ms-ai
server.port=${PORT:8085}

#  Un .env al lado del modulo o en la raiz de TB_web, si lo hay. Las variables
#  de entorno de verdad (Docker, la terminal) igual mandan sobre el.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.forward-headers-strategy=framework
spring.jmx.enabled=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- Las deudas ---------------------------------------------------------------
#  Se piden a ms-debt con la sesion del deudor: el asistente no tiene base.
app.debt-url=${DEBT_URI:http://127.0.0.1:8083}

# ---- El LLM (opcional) ---------------------------------------------------------
# Seleccion explicita. Clave y modelo ausentes permiten arrancar con fallback local.
app.llm.provider=${LLM_PROVIDER:groq}
app.llm.timeout=${LLM_TIMEOUT:30s}
app.llm.groq.api-key=${GROQ_API_KEY:}
app.llm.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.llm.groq.model=${GROQ_MODEL:}
app.llm.gemini.api-key=${GEMINI_API_KEY:}
app.llm.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
app.llm.gemini.model=${GEMINI_MODEL:}
app.llm.xai.api-key=${XAI_API_KEY:}
app.llm.xai.base-url=${XAI_BASE_URL:https://api.x.ai/v1}
app.llm.xai.model=${XAI_MODEL:}

# ---- Salud y documentacion ----------------------------------------------------
#  Solo la salud, que es lo que pregunta el healthcheck de Docker. Ningun
#  otro endpoint del actuator se publica, ni siquiera dentro de la red.
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method

logging.level.com.tbridge=INFO

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
