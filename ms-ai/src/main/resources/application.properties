# =============================================================================
#  ms-ai
# =============================================================================
#  Todo sale de variables de entorno, con valores por omision de desarrollo.
#  No tiene secretos obligatorios: sin llave del LLM responde con reglas.
#
#  Perfiles:  dev  (registro detallado)
# =============================================================================

spring.application.name=ms-ai
server.port=${PORT:8085}

#  Un .env al lado del modulo o en la raiz de TB_web, si lo hay. Las variables
#  de entorno de verdad (Docker, la terminal) igual mandan sobre el.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.forward-headers-strategy=framework
spring.jmx.enabled=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- Las deudas ---------------------------------------------------------------
#  Se piden a ms-debt con la sesion del deudor: el asistente no tiene base.
app.debt-url=${DEBT_URI:http://127.0.0.1:8083}

# ---- La cascada de LLMs (opcional) ---------------------------------------------
#  Proveedores compatibles con la API de OpenAI, probados en este orden: si uno
#  falla, o agota su cuota (429), se pasa al siguiente. Ollama va primero: si
#  corre en el equipo, las deudas de nadie salen de ahi. Groq y Gemini entran
#  solo si traen su llave. Sin ningun proveedor usable, el asistente responde
#  con su motor local de reglas.
app.llm.orden=${LLM_ORDEN:ollama,groq,gemini}
#  Cuantos minutos se salta un proveedor que fallo o agoto su cuota. 0 = sin memoria.
app.llm.enfriamiento-minutos=${LLM_ENFRIAMIENTO_MINUTOS:60}

#  Ollama: local, sin llave ni coste. Con Docker hay que alcanzar el del equipo.
app.llm.proveedores.ollama.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434/v1}
app.llm.proveedores.ollama.model=${OLLAMA_MODEL:llama3.3}
app.llm.proveedores.ollama.requiere-llave=false
app.llm.proveedores.ollama.timeout-segundos=${OLLAMA_TIMEOUT:60}

#  Groq: rapido y con cuota diaria generosa. Llave en console.groq.com.
app.llm.proveedores.groq.api-key=${GROQ_API_KEY:}
app.llm.proveedores.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.llm.proveedores.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.llm.proveedores.groq.timeout-segundos=${GROQ_TIMEOUT:30}

#  Gemini: 1M de contexto. Llave en aistudio.google.com. Compatible con OpenAI.
app.llm.proveedores.gemini.api-key=${GEMINI_API_KEY:}
app.llm.proveedores.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.llm.proveedores.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.llm.proveedores.gemini.timeout-segundos=${GEMINI_TIMEOUT:30}

# ---- Salud y documentacion ----------------------------------------------------
#  Solo la salud, que es lo que pregunta el healthcheck de Docker. Ningun
#  otro endpoint del actuator se publica, ni siquiera dentro de la red.
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method

logging.level.com.tbridge=INFO
