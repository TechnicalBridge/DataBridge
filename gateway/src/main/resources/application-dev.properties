# =============================================================================
#  Perfil dev: para programar con Maven. spring-boot:run lo activa solo:
#      .\mvnw.cmd -f gateway\pom.xml spring-boot:run
# =============================================================================

#  Es el unico perfil que lee el .env (#327): Docker recibe las variables del compose,
#  y las pruebas no tienen por que ver claves de verdad. Busca un .env al lado del
#  modulo o en la raiz de TB_web. Las variables de entorno de verdad mandan sobre el.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

#  Cada ruta que se resuelve y a donde se manda.
logging.level.com.tbridge.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
management.endpoint.health.show-details=always

#  Un cupo holgado: al programar se recarga mucho la misma pagina.
ratelimit.global-capacity=1000
