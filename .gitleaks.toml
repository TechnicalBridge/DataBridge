title = "Secretos nuevos de DataBridge"

[extend]
useDefault = true

[[rules]]
id = "databridge-mercadopago-token"
description = "Token privado de Mercado Pago, no Public Key"
regex = '''\b(?:APP_USR|TEST)-[0-9]+-[0-9]+-[A-Za-z0-9]{20,}-[0-9]+\b'''

[[rules]]
id = "databridge-render-key"
description = "API key privada de Render"
regex = '''\brnd_[A-Za-z0-9_-]{20,}\b'''

[[rules]]
id = "databridge-entorno-literal"
description = "Secreto escrito como valor de configuracion"
regex = '''(?mi)^[ \t]*(?:CIFRADO_LLAVE|JWT_SECRET|INTERNAL_KEY|WEBHOOK_SECRET|MYSQL_PASSWORD|MYSQL_ROOT_PASSWORD|RABBIT_PASSWORD|BREVO_API_KEY|KHIPU_LLAVE|KHIPU_SECRETO|BCENTRAL_PASS|MERCADOPAGO_ACCESS_TOKEN)[ \t]*=[ \t]*['"]?([A-Za-z0-9_./+=!?@%-]{8,})'''
secretGroup = 1

[[rules]]
id = "databridge-secreto-fallback"
description = "Valor secreto por omision en propiedades o Compose"
regex = '''(?i)\$\{(?:CIFRADO_LLAVE|JWT_SECRET|INTERNAL_KEY|WEBHOOK_SECRET|MYSQL_PASSWORD|MYSQL_ROOT_PASSWORD|RABBIT_PASSWORD|BREVO_API_KEY|KHIPU_LLAVE|KHIPU_SECRETO|BCENTRAL_PASS|MERCADOPAGO_ACCESS_TOKEN):(?:-)?([A-Za-z0-9_][A-Za-z0-9_./+=!?@%-]{7,})\}'''
secretGroup = 1

# Solo valores publicos exactos: la llave oficial de integracion y las huellas
# de valores antiguos. No se omiten carpetas de pruebas ni hashes arbitrarios.
[allowlist]
description = "Integracion publica de Transbank y huellas, no credenciales"
regexTarget = "secret"
